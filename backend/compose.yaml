name: sixsummit-backend
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Run npm run setup:env first}
      POSTGRES_USER: ${DB_USER:?Run npm run setup:env first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup:env first}
    ports:
      - "127.0.0.1:${DB_PORT:-55439}:5432"
    volumes:
      - leads-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  leads-db:
